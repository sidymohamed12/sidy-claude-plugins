# Routes publiques (Gateway API). La passerelle `public-gateway` appartient à la plateforme
# (namespace gateway-system) : elle porte le TLS et doit autoriser les routes du namespace `app`.
# Seul /api est routé : /actuator n'atteint jamais l'extérieur, les sondes passent par le kubelet.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: app
  labels:
    app.kubernetes.io/name: app
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - api.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: app
          port: 8080
      timeouts:
        request: 30s
---
# Redirection HTTP -> HTTPS sur l'écouteur http
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-redirect-https
  namespace: app
  labels:
    app.kubernetes.io/name: app
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - api.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
