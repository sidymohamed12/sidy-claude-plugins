apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: app
  labels:
    app.kubernetes.io/name: app
data:
  SPRING_PROFILES_ACTIVE: prod
  APP_TIMEZONE: UTC
  TZ: UTC
  FLYWAY_ENABLED: "false"
  BLOQUER_NAVIGATION_DIRECTE: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CORS_ALLOWED_ORIGINS: https://app.example.com
