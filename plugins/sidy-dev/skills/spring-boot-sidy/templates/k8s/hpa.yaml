# OPTIONNEL, hors kustomization. Demande metrics-server dans le cluster.
# Pour l'utiliser : retirer `replicas` du Deployment, puis ajouter ce fichier au kustomization.
# Sans metrics-server, ne pas l'activer : le nombre de replicas ne bougerait plus.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
  namespace: app
  labels:
    app.kubernetes.io/name: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
