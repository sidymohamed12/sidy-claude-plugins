# À copier dans .github/workflows/ci.yml du projet Spring Boot.
# Tests + couverture + Sonar, validation des manifestes, build de l'image (poussée sur GHCR hors PR).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Un nouveau push annule le run en cours d'une PR, jamais celui de main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar a besoin de l'historique (blame, code neuf)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Testcontainers (PostgreSQL, Redis) utilise le Docker du runner. Le build échoue sous le seuil JaCoCo.
      - name: Build, tests et couverture
        run: ./mvnw -B -ntp verify
      # Sans SONAR_TOKEN (PR venant d'un fork, projet sans Sonar) l'étape est sautée.
      - name: Analyse Sonar et Quality Gate
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.qualitygate.wait=true

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Installer kubeconform
        run: |
          curl -sSfL -o /tmp/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
      - name: Valider les manifestes
        run: |
          kubectl kustomize deploy/k8s > /tmp/rendered.yaml
          cat deploy/k8s/job-flyway.yaml >> /tmp/rendered.yaml
          /tmp/kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml

  image:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
      # Sur une PR l'image est construite pour vérifier le Dockerfile, pas poussée.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest à déployer
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Image poussée"
            echo
            echo "Pour déployer : workflow **Deploy**, champ \`image\` :"
            echo
            echo "\`ghcr.io/${REPO}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
