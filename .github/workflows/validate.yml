name: Validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plugins:
    name: Manifestes, agents et skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tests du validateur
        run: node --test scripts/*.test.mjs
      # Versions identiques, nombre et liste des agents / skills annoncés, en-têtes des agents et des skills.
      - name: Cohérence du dépôt
        run: node scripts/validate-plugins.mjs
